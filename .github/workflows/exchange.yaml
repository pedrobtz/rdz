# Cross-platform fixture exchange (plan-c Stage I): Linux, macOS and Windows
# each write the frozen corpus's specs (tools/exchange.R write), then every
# platform reads every platform's files (tools/exchange.R check): each reads
# to its spec's value, and every uncompressed file is the same bytes
# everywhere and the same as the frozen corpus's.
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:

name: exchange

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  write:
    runs-on: ${{ matrix.os }}
    name: write (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: local::.
          needs: exchange
      - name: Write this platform's files
        run: Rscript tools/exchange.R write exchange/${{ matrix.os }}
      - uses: actions/upload-artifact@v4
        with:
          name: exchange-${{ matrix.os }}
          path: exchange/${{ matrix.os }}

  check:
    needs: write
    runs-on: ${{ matrix.os }}
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
          extra-packages: local::.
          needs: exchange
      - uses: actions/download-artifact@v4
        with:
          pattern: exchange-*
          path: exchange
      - name: Read every platform's files
        shell: bash
        run: Rscript tools/exchange.R check exchange/exchange-*
