# rdz against fst on a GitHub Linux (x86-64) runner: tools/bench-vs-fst.R,
# one thread each. The table goes to the run's summary and the CSV is kept
# as an artifact. Informational: shared runners are too noisy for a
# threshold, so a slower result does not fail the run.
on:
  push:
    branches: [main, master]
    paths: ["src/**", "R/**", "tools/bench-vs-fst.R", ".github/workflows/benchmarks.yaml"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:
    inputs:
      rows:
        description: Rows per column
        type: number
        default: 5000000

name: benchmarks

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  vs-fst:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::fst, any::bench, local::.
          dependencies: '"hard"'

      - name: Benchmark
        run: Rscript tools/bench-vs-fst.R ${{ inputs.rows || 5000000 }} bench-vs-fst.csv bench-vs-fst.md

      - name: Summary
        if: always()
        run: test -f bench-vs-fst.md && cat bench-vs-fst.md >> "$GITHUB_STEP_SUMMARY" || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-vs-fst
          path: bench-vs-fst.*
          if-no-files-found: ignore
