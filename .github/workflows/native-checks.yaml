# The family's native gates (plan-c.md section 7), from pedrobtz/r-actions.
# Where a workflow takes an environment, RDZ_RUST=0 builds the C
# implementation alone, which is what these gates are for; valgrind and LTO
# build the Rust reference implementation as well when the runner has cargo.
on:
  push:
    branches: [main, master]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

name: native-checks

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sanitizers:
    uses: pedrobtz/r-actions/.github/workflows/sanitizers.yml@70cdfd7c6d62f42828e931a7f061ce998bb0e8f5 # v1.21.0
    with:
      asan: true
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}
      env: |
        RDZ_RUST=0

  valgrind:
    uses: pedrobtz/r-actions/.github/workflows/valgrind.yml@70cdfd7c6d62f42828e931a7f061ce998bb0e8f5 # v1.21.0
    with:
      profile: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'full-ci') && 'quick' || 'full' }}

  lto:
    uses: pedrobtz/r-actions/.github/workflows/lto.yml@70cdfd7c6d62f42828e931a7f061ce998bb0e8f5 # v1.21.0

  gctorture:
    uses: pedrobtz/r-actions/.github/workflows/gctorture.yml@70cdfd7c6d62f42828e931a7f061ce998bb0e8f5 # v1.21.0
    with:
      profile: ${{ github.event_name == 'pull_request' && 'quick' || 'full' }}
      timeout-minutes: 240
      env: |
        RDZ_RUST=0

  rchk:
    uses: pedrobtz/r-actions/.github/workflows/rchk.yml@70cdfd7c6d62f42828e931a7f061ce998bb0e8f5 # v1.21.0
    with:
      fail-on-findings: true
      github-packages: |
        pedrobtz/zufast
        pedrobtz/zubin
